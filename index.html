    <!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>부동산 매물관리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <h1>🏢 부동산 매물관리</h1>
    <p>등록된 이메일로 접속하세요</p>
    <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email">
    <button id="authBtn">접속</button>
    <div id="authMsg" class="auth-msg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingMsg">데이터 로드 중...</div>
  </div>

  <div id="topbar">
    <div class="brand">🏢 매물관리 <span id="totalBadge" class="badge">0</span></div>
    <div class="tabs">
      <button class="tab active" data-tab="property">매물</button>
      <button class="tab" data-tab="customer">고객</button>
    </div>
    <button id="addPropertyBtn" class="btn-primary">+ 매물등록</button>
    <button id="logoutBtn" class="logout">로그아웃</button>
  </div>

  <div id="propertyPane" class="pane">
    <div id="layout">
      <aside id="sidebar">
        <div class="filter-panel">
          <div class="filter-row">
            <select id="filterType">
              <option value="">전체 유형</option>
              <option>토지</option>
              <option>상가</option>
              <option>공장창고</option>
              <option>주택</option>
            </select>
            <select id="filterTypeDetail">
              <option value="">전체 상세</option>
            </select>
          </div>
          <div class="filter-row">
            <select id="filterTrade">
              <option value="">전체 거래</option>
              <option>매매</option><option>전세</option><option>연세</option>
              <option>월세</option><option>단기</option>
            </select>
          </div>

          <div class="filter-price">
            <label>가격범위 (만원)</label>
            <div class="price-inputs">
              <input type="number" id="priceMin" placeholder="최소" value="">
              <span>~</span>
              <input type="number" id="priceMax" placeholder="최대" value="">
            </div>
          </div>

          <input type="text" id="searchInput" placeholder="매물명, 주소, 고객 검색">
          <div id="countBar">표시 <span id="filteredCount">0</span> / 전체 <span id="totalCount">0</span></div>
        </div>

        <div id="listContainer"></div>
      </aside>

      <main id="mapContainer">
        <div id="map"></div>
      </main>

      <aside id="detailPanel" class="hidden">
        <button class="detail-close" id="detailClosePC">✕</button>
        <div id="detailContent"></div>
      </aside>
    </div>

    <div id="bottomSheet" class="hidden">
      <div class="bs-handle"></div>
      <button class="detail-close" id="detailCloseMobile">✕</button>
      <div id="bottomSheetContent"></div>
    </div>
  </div>

  <div id="customerPane" class="pane hidden">
    <div class="customer-placeholder">
      <p>고객관리 화면은 다음 단계에서 구현됩니다.</p>
    </div>
  </div>
</div>

<div id="addPropertyModal" class="modal hidden">
  <div class="modal-box modal-large">
    <div class="modal-header">
      <h2>매물 등록</h2>
      <button class="modal-close" id="closeAddModal">✕</button>
    </div>

    <div class="modal-body">

      <!-- 섹션 1: 기본 정보 -->
      <section class="form-section">
        <h3>기본 정보</h3>
        <div class="form-grid">
        <div class="form-field full">
          <label>
            매물명 <span class="req">*</span>
            <button type="button" id="btnGenerateName" class="btn-inline">🔄 자동 생성</button>
          </label>
          <input type="text" id="f_매물명" placeholder="자동 생성되거나 직접 입력하세요">
          <div class="field-hint" id="nameHint"></div>
        </div>

          <div class="form-field">
            <label>매물유형 <span class="req">*</span></label>
            <select id="f_매물유형">
              <option value="">선택</option>
              <option>토지</option>
              <option>상가</option>
              <option>공장창고</option>
              <option>주택</option>
            </select>
          </div>

          <div class="form-field">
            <label>매물유형상세</label>
            <select id="f_매물유형상세">
              <option value="">선택</option>
            </select>
          </div>

          <div class="form-field">
            <label>매물상태</label>
            <select id="f_매물상태">
              <option>광고중</option>
              <option>계약중</option>
              <option>완료</option>
              <option>보류</option>
            </select>
          </div>
        </div>
      </section>

      <!-- 섹션 2: 고객 (소유주) -->
      <section class="form-section">
        <h3>소유주 (고객)</h3>
        <div class="customer-search">
          <input type="text" id="f_customerSearch" placeholder="고객명 또는 연락처로 검색">
          <button type="button" id="btnSearchCustomer">🔍 검색</button>
          <button type="button" id="btnNewCustomer" class="btn-secondary">+ 신규 등록</button>
        </div>
        <div id="customerSearchResults" class="search-results hidden"></div>
        <div id="selectedCustomer" class="selected-customer hidden">
          <span class="label">선택된 고객:</span>
          <span id="selectedCustomerInfo"></span>
          <button type="button" id="btnClearCustomer" class="btn-clear">✕</button>
        </div>
        <input type="hidden" id="f_고객ID" value="">

        <div id="newCustomerForm" class="new-customer-form hidden">
          <div class="form-grid">
            <div class="form-field">
              <label>고객명 <span class="req">*</span></label>
              <input type="text" id="f_신규고객명">
            </div>
            <div class="form-field">
              <label>연락처</label>
              <input type="text" id="f_신규고객연락처" placeholder="010-0000-0000">
            </div>
            <div class="form-field">
              <label>고객유형</label>
              <select id="f_신규고객유형">
                <option>일반</option>
                <option>중개사</option>
                <option>분양사</option>
              </select>
            </div>
            <div class="form-field">
              <label>거래유형</label>
              <select id="f_신규고객거래유형">
                <option>매도</option>
                <option>임대 전세</option>
                <option>임대 연세</option>
                <option>임대 월세</option>
                <option>임대 단기</option>
              </select>
            </div>
          </div>
        </div>
      </section>

      <!-- 섹션 3: 위치 -->
      <section class="form-section">
        <h3>위치</h3>
        <div class="form-grid">
        <div class="form-field location-combobox-wrapper">
          <label>소재지 <span class="req">*</span></label>
          <div class="combobox">
            <input type="text" id="f_소재지" placeholder="타이핑하면 검색됩니다 (예: 해안)" autocomplete="off">
            <button type="button" class="combobox-toggle" id="btnToggleLocation">▼</button>
            <div class="combobox-dropdown hidden" id="locationDropdown"></div>
          </div>
        </div>
          <div class="form-field">
            <label>산</label>
            <select id="f_산">
              <option value="">-</option>
              <option>산</option>
            </select>
          </div>
          <div class="form-field">
            <label>본번</label>
            <input type="text" id="f_본번">
          </div>
          <div class="form-field">
            <label>부번</label>
            <input type="text" id="f_부번">
          </div>
        </div>

        <div class="form-actions-inline">
          <button type="button" id="btnGeocode" class="btn-secondary">🔍 좌표 자동 조회</button>
          <span id="geocodeStatus" class="geocode-status"></span>
        </div>

        <div class="form-grid">
          <div class="form-field full">
            <label>지번주소 (자동 생성)</label>
            <input type="text" id="f_지번주소" readonly>
          </div>
          <div class="form-field full">
            <label>좌표 (자동 생성)</label>
            <input type="text" id="f_좌표" readonly placeholder="위도,경도">
          </div>
        </div>
      </section>

      <!-- 섹션 4: 거래 조건 (체크박스 다중) -->
      <section class="form-section">
        <h3>거래 조건 <span class="hint">복수 선택 가능</span></h3>

        <div class="deal-row">
          <label class="deal-check">
            <input type="checkbox" id="deal_매매" data-type="매매">
            <span>매매</span>
          </label>
          <div class="deal-inputs">
            <input type="number" id="f_매매가" placeholder="매매가 (만원)" disabled>
          </div>
        </div>

        <div class="deal-row">
          <label class="deal-check">
            <input type="checkbox" id="deal_전세" data-type="전세">
            <span>전세</span>
          </label>
          <div class="deal-inputs">
            <input type="number" id="f_보증금_전세" placeholder="보증금 (만원)" disabled>
          </div>
        </div>

        <div class="deal-row">
          <label class="deal-check">
            <input type="checkbox" id="deal_연세" data-type="연세">
            <span>연세</span>
          </label>
          <div class="deal-inputs">
            <input type="number" id="f_연세" placeholder="연세 (만원)" disabled>
          </div>
        </div>

        <div class="deal-row">
          <label class="deal-check">
            <input type="checkbox" id="deal_월세" data-type="월세">
            <span>월세</span>
          </label>
          <div class="deal-inputs">
            <input type="number" id="f_보증금_월세" placeholder="보증금 (만원)" disabled>
            <input type="number" id="f_월세" placeholder="월세 (만원)" disabled>
          </div>
        </div>

        <div class="deal-row">
          <label class="deal-check">
            <input type="checkbox" id="deal_단기" data-type="단기">
            <span>단기</span>
          </label>
          <div class="deal-inputs">
            <input type="number" id="f_보증금_단기" placeholder="보증금 (만원)" disabled>
            <input type="number" id="f_월세_단기" placeholder="월세 (만원)" disabled>
          </div>
        </div>

        <div class="form-grid" style="margin-top: 12px;">
          <div class="form-field">
            <label>관리비 (만원)</label>
            <input type="number" id="f_관리비">
          </div>
          <div class="form-field">
            <label>권리금 (만원)</label>
            <input type="number" id="f_권리금">
          </div>
        </div>
      </section>

      <!-- 섹션 5: 상세 정보 (유형별 조건부) -->
      <section class="form-section" id="typeSpecificSection">
        <h3>상세 정보</h3>
        <div id="typeSpecificFields">
          <div class="empty-hint">매물유형을 선택하면 해당 필드가 나타납니다.</div>
        </div>
      </section>

      <!-- 섹션 6: 기타 -->
      <section class="form-section">
        <h3>기타</h3>
        <div class="form-grid">
          <div class="form-field full">
            <label>블로그 링크</label>
            <input type="url" id="f_블로그링크" placeholder="https://blog.naver.com/...">
          </div>
          <div class="form-field full">
            <label>내용/메모</label>
            <textarea id="f_내용" rows="3"></textarea>
          </div>
        </div>
      </section>

    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" id="btnCancelAdd">취소</button>
      <button type="button" class="btn-primary" id="btnSaveAdd">저장</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
